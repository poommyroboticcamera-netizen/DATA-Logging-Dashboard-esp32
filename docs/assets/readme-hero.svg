<svg width="1440" height="680" viewBox="0 0 1440 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 Data Logging Dashboard</title>
  <desc id="desc">Dark technical dashboard with live speed, current, temperature, motion, and data logging indicators.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="20" x2="1340" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.55" stop-color="#070C15"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(1120 44) rotate(137) scale(520 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(84 655) rotate(-35) scale(500 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill: #8290A8; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .value { fill: #F8FAFC; font-size: 34px; font-weight: 750; }
      .unit { fill: #8290A8; font-size: 13px; font-weight: 600; }
      .small { fill: #94A3B8; font-size: 13px; }
    </style>
  </defs>

  <rect width="1440" height="680" rx="30" fill="url(#background)"/>
  <rect width="1440" height="680" rx="30" fill="url(#glowBlue)"/>
  <rect width="1440" height="680" rx="30" fill="url(#glowViolet)"/>
  <path d="M0 1H1440" stroke="#334155" stroke-opacity="0.5"/>

  <g opacity="0.3">
    <circle cx="1246" cy="92" r="2" fill="#38BDF8"/>
    <circle cx="1282" cy="92" r="2" fill="#38BDF8"/>
    <circle cx="1318" cy="92" r="2" fill="#38BDF8"/>
    <circle cx="1246" cy="128" r="2" fill="#38BDF8"/>
    <circle cx="1282" cy="128" r="2" fill="#38BDF8"/>
    <circle cx="1318" cy="128" r="2" fill="#38BDF8"/>
    <circle cx="1246" cy="164" r="2" fill="#38BDF8"/>
    <circle cx="1282" cy="164" r="2" fill="#38BDF8"/>
    <circle cx="1318" cy="164" r="2" fill="#38BDF8"/>
  </g>

  <g class="sans">
    <g transform="translate(60 48)">
      <rect width="42" height="42" rx="11" fill="#0F1B2C" stroke="#334155"/>
      <rect x="12" y="12" width="18" height="18" rx="3" stroke="#38BDF8" stroke-width="2"/>
      <path d="M17 8V12M25 8V12M17 30V34M25 30V34M8 17H12M8 25H12M30 17H34M30 25H34" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="21" cy="21" r="4" fill="#38BDF8"/>
    </g>
    <text x="118" y="68" fill="#F8FAFC" font-size="19" font-weight="760">ESP32 TELEMETRY</text>
    <text x="118" y="89" fill="#64748B" font-size="12" font-weight="650" letter-spacing="1.6">DATA LOGGING DASHBOARD</text>

    <g transform="translate(1150 52)">
      <rect width="226" height="38" rx="19" fill="#0C1B19" stroke="#1D4F42"/>
      <circle cx="20" cy="19" r="5" fill="#34D399"/>
      <circle cx="20" cy="19" r="8" fill="#34D399" opacity="0.18" filter="url(#softGlow)"/>
      <text x="36" y="24" fill="#6EE7B7" font-size="13" font-weight="750">SYSTEM ONLINE</text>
      <text x="155" y="24" fill="#64748B" font-size="11" class="mono">CORE 0/1</text>
    </g>

    <text x="60" y="157" fill="#F8FAFC" font-size="45" font-weight="780" letter-spacing="-1.2">Observe every signal.</text>
    <text x="60" y="205" fill="url(#blue)" font-size="45" font-weight="780" letter-spacing="-1.2">Capture every moment.</text>
    <text x="62" y="243" fill="#94A3B8" font-size="16">Real-time sensing, browser visualization, and CSV logging on one ESP32.</text>

    <g transform="translate(60 280)" filter="url(#shadow)">
      <rect width="286" height="160" rx="18" fill="#101927" stroke="#263449"/>
      <text x="22" y="30" class="label">WHEEL SPEED</text>
      <path d="M39 124A78 78 0 0 1 247 124" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
      <path d="M39 124A78 78 0 0 1 178 64" stroke="url(#blue)" stroke-width="14" stroke-linecap="round"/>
      <text x="143" y="102" text-anchor="middle" class="value mono">42.8</text>
      <text x="143" y="124" text-anchor="middle" class="unit">km/h</text>
      <text x="20" y="145" class="small mono">0</text>
      <text x="250" y="145" text-anchor="end" class="small mono">60</text>
    </g>

    <g transform="translate(362 280)" filter="url(#shadow)">
      <rect width="250" height="160" rx="18" fill="#101927" stroke="#263449"/>
      <text x="22" y="30" class="label">INA226 · CH1</text>
      <rect x="22" y="51" width="206" height="1" fill="#253247"/>
      <text x="22" y="92" class="value mono">12.48</text>
      <text x="151" y="91" class="unit">V</text>
      <circle cx="25" cy="125" r="5" fill="#34D399"/>
      <text x="39" y="130" fill="#6EE7B7" font-size="13" font-weight="700">VALID</text>
      <text x="228" y="130" text-anchor="end" class="small mono">1.24 A</text>
    </g>

    <g transform="translate(628 280)" filter="url(#shadow)">
      <rect width="250" height="160" rx="18" fill="#101927" stroke="#263449"/>
      <text x="22" y="30" class="label">TEMPERATURE</text>
      <rect x="22" y="51" width="206" height="1" fill="#253247"/>
      <text x="22" y="92" class="value mono">29.4</text>
      <text x="133" y="91" class="unit">°C</text>
      <path d="M22 126C49 113 69 135 94 121C121 106 141 130 167 115C188 104 207 108 228 98" stroke="url(#green)" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 140H228" stroke="#253247"/>
    </g>

    <g transform="translate(894 280)" filter="url(#shadow)">
      <rect width="250" height="160" rx="18" fill="#101927" stroke="#263449"/>
      <text x="22" y="30" class="label">IMU ORIENTATION</text>
      <g transform="translate(125 92)">
        <path d="M0 -42L54 -10L0 22L-54 -10L0 -42Z" fill="#2563EB" fill-opacity="0.62" stroke="#60A5FA" stroke-width="2"/>
        <path d="M-54 -10V8L0 40V22L-54 -10Z" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
        <path d="M54 -10V8L0 40V22L54 -10Z" fill="#312E81" stroke="#8B5CF6" stroke-width="1.5"/>
        <path d="M0 -50V-24" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
        <path d="M-5 -30L0 -24L5 -30" stroke="#34D399" stroke-width="2"/>
      </g>
      <text x="22" y="137" class="small mono">YAW +18.6°</text>
      <text x="228" y="137" text-anchor="end" class="small mono">50 Hz</text>
    </g>

    <g transform="translate(1160 280)" filter="url(#shadow)">
      <rect width="216" height="160" rx="18" fill="#101927" stroke="#263449"/>
      <text x="22" y="30" class="label">RECORDING</text>
      <circle cx="108" cy="82" r="35" fill="#21151B" stroke="#7F1D1D"/>
      <circle cx="108" cy="82" r="14" fill="#FB7185"/>
      <circle cx="108" cy="82" r="22" fill="#FB7185" opacity="0.16" filter="url(#softGlow)"/>
      <text x="108" y="139" text-anchor="middle" fill="#FDA4AF" font-size="13" font-weight="750">CSV · 250 ms</text>
    </g>

    <g transform="translate(60 466)" filter="url(#shadow)">
      <rect width="818" height="154" rx="18" fill="#0D1521" stroke="#263449"/>
      <text x="22" y="31" class="label">REAL-TIME SIGNALS</text>
      <g opacity="0.55">
        <path d="M22 58H796M22 88H796M22 118H796" stroke="#263449"/>
        <path d="M113 46V130M204 46V130M295 46V130M386 46V130M477 46V130M568 46V130M659 46V130M750 46V130" stroke="#1E293B"/>
      </g>
      <path d="M22 102C62 96 78 99 113 86C145 74 177 95 204 91C242 85 258 62 295 70C332 78 350 107 386 98C429 87 436 68 477 76C515 83 532 103 568 94C610 84 621 59 659 67C702 77 716 91 750 81C767 76 780 73 796 75" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 122C58 116 78 120 113 111C145 103 174 115 204 107C241 97 264 112 295 102C327 92 349 105 386 99C422 92 445 108 477 100C511 91 534 106 568 97C604 88 626 103 659 96C698 87 719 103 750 95C767 91 781 94 796 88" stroke="url(#violet)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <circle cx="796" cy="75" r="4" fill="#38BDF8"/>
      <circle cx="796" cy="75" r="9" fill="#38BDF8" opacity="0.18" filter="url(#softGlow)"/>
      <text x="22" y="143" class="small mono">-30 s</text>
      <text x="796" y="143" text-anchor="end" class="small mono">LIVE</text>
    </g>

    <g transform="translate(894 466)" filter="url(#shadow)">
      <rect width="482" height="154" rx="18" fill="#0D1521" stroke="#263449"/>
      <text x="22" y="31" class="label">DEVICE STATUS</text>
      <g transform="translate(22 51)">
        <circle cx="5" cy="5" r="5" fill="#34D399"/>
        <text x="18" y="10" class="small">INA226 ×3</text>
        <circle cx="167" cy="5" r="5" fill="#34D399"/>
        <text x="180" y="10" class="small">RTC</text>
        <circle cx="307" cy="5" r="5" fill="#34D399"/>
        <text x="320" y="10" class="small">ENCODER</text>
      </g>
      <g transform="translate(22 85)">
        <circle cx="5" cy="5" r="5" fill="#34D399"/>
        <text x="18" y="10" class="small">DS18B20 ×4</text>
        <circle cx="167" cy="5" r="5" fill="#F59E0B"/>
        <text x="180" y="10" class="small">DHT22</text>
        <circle cx="307" cy="5" r="5" fill="#34D399"/>
        <text x="320" y="10" class="small">IMU</text>
      </g>
      <rect x="22" y="121" width="438" height="8" rx="4" fill="#1E293B"/>
      <rect x="22" y="121" width="382" height="8" rx="4" fill="url(#green)"/>
      <text x="460" y="145" text-anchor="end" fill="#64748B" font-size="11" class="mono">FREERTOS · WIFI · SD</text>
    </g>

    <text x="60" y="655" fill="#475569" font-size="12" letter-spacing="1.2">ESP32 · FREERTOS · PLATFORMIO · EMBEDDED WEB UI</text>
    <text x="1376" y="655" text-anchor="end" fill="#475569" font-size="12" class="mono">LOCAL-FIRST TELEMETRY</text>
  </g>
</svg>
